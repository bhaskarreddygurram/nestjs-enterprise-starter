# ⚠️  LOCAL-DEV VALUES ONLY — the same throwaway credentials used in
#     .env.example / the seed. They make `kubectl apply -k` work out of the box
#     on a local cluster. NEVER use these in a real deployment: instead create
#     the Secret out-of-band, e.g.
#       kubectl -n enterprise create secret generic app-secret \
#         --from-literal=JWT_ACCESS_SECRET=$(openssl rand -base64 48) \
#         --from-literal=DATABASE_URL=... --from-literal=POSTGRES_PASSWORD=...
#     (and remove this file from the kustomization), or use a sealed-secrets /
#     external-secrets operator.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # Postgres container credentials (consumed by the postgres StatefulSet).
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'postgres'
  POSTGRES_DB: 'enterprise_db'
  # App/Prisma connection string — host is the in-cluster `postgres` Service.
  DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/enterprise_db?schema=public'
  # Dev JWT secret (>= 16 chars). Rotate in any real environment.
  JWT_ACCESS_SECRET: 'dev_access_secret_change_me_in_production_please'
  # Optional: set AI_ENABLED=true in the ConfigMap and put a real key here.
  ANTHROPIC_API_KEY: ''
