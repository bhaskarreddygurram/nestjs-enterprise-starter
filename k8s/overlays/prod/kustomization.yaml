# Prod-style overlay: three API replicas, info logging, roomier CPU limits.
# Apply with:  kubectl apply -k k8s/overlays/prod
# (Still targets a local cluster here — swap image tags / secrets for real use.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: nestjs-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: '1'
