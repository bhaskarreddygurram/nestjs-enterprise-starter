<svg viewBox="0 0 940 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>NestJS Enterprise Backend — System Architecture</title>
  <desc>A layered NestJS backend: client to a request pipeline of guards, interceptors and filters; feature modules including an AI Insights module that calls the Claude API; core infrastructure (Prisma/PostgreSQL, Redis, Mail, Config); a cross-cutting observability band (Pino logs, Prometheus metrics, health, graceful shutdown); and a CI/CD delivery strip to Docker/GHCR and Render.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t{fill:#0f172a;font-weight:600;}
      .s{fill:#64748b;}
      .lab{fill:#64748b;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;}
      .band{fill:#0f172a;fill-opacity:.035;stroke:#cbd5e1;stroke-width:1;stroke-dasharray:4 3;}
      .ai{fill:#6366f1;fill-opacity:.06;stroke:#6366f1;stroke-width:2;}
      .ait{fill:#6366f1;font-weight:700;}
      .edge{stroke:#94a3b8;stroke-width:1.5;fill:none;}
      .edgeA{stroke:#6366f1;stroke-width:2;fill:none;stroke-dasharray:5 3;}
      text{font-size:12px;}
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="620" fill="#ffffff"/>

  <text x="40" y="30" class="t" font-size="17">NestJS Enterprise Backend — System Architecture</text>
  <rect x="742" y="19" width="12" height="12" rx="2" class="ai"/>
  <text x="760" y="29" class="s" font-size="11">AI / LLM path</text>

  <rect x="390" y="48" width="160" height="44" rx="10" class="box"/>
  <text x="470" y="70" class="t" font-size="13" text-anchor="middle">Client</text>
  <text x="470" y="85" class="s" font-size="10" text-anchor="middle">Web · Swagger · consumers</text>
  <line x1="470" y1="92" x2="470" y2="112" class="edge" marker-end="url(#ah)"/>

  <rect x="60" y="114" width="820" height="72" rx="12" class="band"/>
  <text x="72" y="130" class="lab" font-size="9.5">Request pipeline</text>
  <rect x="80" y="138" width="240" height="40" rx="8" class="box"/>
  <text x="200" y="156" class="t" font-size="12" text-anchor="middle">Guards</text>
  <text x="200" y="170" class="s" font-size="10" text-anchor="middle">JWT · RBAC · Throttle</text>
  <rect x="350" y="138" width="240" height="40" rx="8" class="box"/>
  <text x="470" y="156" class="t" font-size="12" text-anchor="middle">Interceptors</text>
  <text x="470" y="170" class="s" font-size="10" text-anchor="middle">Envelope · Metrics</text>
  <rect x="620" y="138" width="240" height="40" rx="8" class="box"/>
  <text x="740" y="156" class="t" font-size="12" text-anchor="middle">Exception filter</text>
  <text x="740" y="170" class="s" font-size="10" text-anchor="middle">Consistent error shape</text>
  <line x1="470" y1="186" x2="470" y2="206" class="edge" marker-end="url(#ah)"/>

  <text x="60" y="216" class="lab" font-size="9.5">Feature modules · controller → service → repository</text>
  <rect x="60" y="224" width="195" height="46" rx="9" class="box"/>
  <text x="157" y="244" class="t" font-size="12" text-anchor="middle">Auth &amp; 2FA</text>
  <text x="157" y="259" class="s" font-size="10" text-anchor="middle">login · refresh · TOTP</text>
  <rect x="275" y="224" width="195" height="46" rx="9" class="box"/>
  <text x="372" y="244" class="t" font-size="12" text-anchor="middle">Users</text>
  <text x="372" y="259" class="s" font-size="10" text-anchor="middle">CRUD · argon2id</text>
  <rect x="490" y="224" width="195" height="46" rx="9" class="box"/>
  <text x="587" y="244" class="t" font-size="12" text-anchor="middle">RBAC</text>
  <text x="587" y="259" class="s" font-size="10" text-anchor="middle">roles · permissions</text>
  <rect x="705" y="224" width="195" height="46" rx="9" class="box"/>
  <text x="802" y="244" class="t" font-size="12" text-anchor="middle">Files</text>
  <text x="802" y="259" class="s" font-size="10" text-anchor="middle">upload · storage adapter</text>

  <rect x="60" y="280" width="195" height="46" rx="9" class="box"/>
  <text x="157" y="300" class="t" font-size="12" text-anchor="middle">Notifications</text>
  <text x="157" y="315" class="s" font-size="10" text-anchor="middle">in-app · email</text>
  <rect x="275" y="280" width="195" height="46" rx="9" class="box"/>
  <text x="372" y="300" class="t" font-size="12" text-anchor="middle">Audit</text>
  <text x="372" y="315" class="s" font-size="10" text-anchor="middle">immutable event log</text>
  <rect x="490" y="280" width="195" height="46" rx="9" class="ai"/>
  <text x="587" y="300" class="ait" font-size="12" text-anchor="middle">AI Insights</text>
  <text x="587" y="315" class="s" font-size="10" text-anchor="middle">Claude · structured JSON</text>

  <rect x="760" y="280" width="140" height="46" rx="9" class="ai"/>
  <text x="830" y="300" class="ait" font-size="12" text-anchor="middle">Claude API</text>
  <text x="830" y="315" class="s" font-size="10" text-anchor="middle">claude-opus-4-8</text>
  <line x1="685" y1="303" x2="760" y2="303" class="edgeA" marker-end="url(#ahA)"/>
  <line x1="470" y1="326" x2="470" y2="350" class="edge" marker-end="url(#ah)"/>

  <text x="60" y="360" class="lab" font-size="9.5">Core infrastructure</text>
  <rect x="60" y="368" width="195" height="46" rx="9" class="box"/>
  <text x="157" y="388" class="t" font-size="11.5" text-anchor="middle">Prisma → PostgreSQL</text>
  <text x="157" y="403" class="s" font-size="10" text-anchor="middle">typed data access</text>
  <rect x="275" y="368" width="195" height="46" rx="9" class="box"/>
  <text x="372" y="388" class="t" font-size="12" text-anchor="middle">Redis</text>
  <text x="372" y="403" class="s" font-size="10" text-anchor="middle">cache · rate-limit</text>
  <rect x="490" y="368" width="195" height="46" rx="9" class="box"/>
  <text x="587" y="388" class="t" font-size="12" text-anchor="middle">Mail</text>
  <text x="587" y="403" class="s" font-size="10" text-anchor="middle">SMTP · console adapter</text>
  <rect x="705" y="368" width="195" height="46" rx="9" class="box"/>
  <text x="802" y="388" class="t" font-size="12" text-anchor="middle">Config</text>
  <text x="802" y="403" class="s" font-size="10" text-anchor="middle">Joi-validated env</text>

  <rect x="60" y="436" width="840" height="58" rx="12" class="band"/>
  <text x="72" y="453" class="lab" font-size="9.5">Observability &amp; ops · cross-cutting</text>
  <rect x="80" y="458" width="185" height="28" rx="14" class="box"/>
  <text x="172" y="476" class="t" font-size="11" text-anchor="middle">Pino structured logs</text>
  <rect x="280" y="458" width="230" height="28" rx="14" class="box"/>
  <text x="395" y="476" class="t" font-size="11" text-anchor="middle">Prometheus /metrics (+ AI tokens)</text>
  <rect x="525" y="458" width="160" height="28" rx="14" class="box"/>
  <text x="605" y="476" class="t" font-size="11" text-anchor="middle">Terminus health</text>
  <rect x="700" y="458" width="180" height="28" rx="14" class="box"/>
  <text x="790" y="476" class="t" font-size="11" text-anchor="middle">graceful shutdown</text>

  <text x="60" y="524" class="lab" font-size="9.5">Delivery</text>
  <rect x="60" y="532" width="220" height="44" rx="9" class="box"/>
  <text x="170" y="552" class="t" font-size="12" text-anchor="middle">GitHub Actions CI</text>
  <text x="170" y="567" class="s" font-size="10" text-anchor="middle">lint · test · coverage gate</text>
  <line x1="284" y1="554" x2="324" y2="554" class="edge" marker-end="url(#ah)"/>
  <rect x="328" y="532" width="220" height="44" rx="9" class="box"/>
  <text x="438" y="552" class="t" font-size="12" text-anchor="middle">Docker → GHCR</text>
  <text x="438" y="567" class="s" font-size="10" text-anchor="middle">multi-stage image</text>
  <line x1="552" y1="554" x2="592" y2="554" class="edge" marker-end="url(#ah)"/>
  <rect x="596" y="532" width="220" height="44" rx="9" class="box"/>
  <text x="706" y="552" class="t" font-size="12" text-anchor="middle">Render</text>
  <text x="706" y="567" class="s" font-size="10" text-anchor="middle">live deployment · Swagger</text>
</svg>
